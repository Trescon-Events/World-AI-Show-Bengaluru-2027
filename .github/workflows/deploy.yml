name: Deploy Next.js site to Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rewrite basePath for GitHub Pages (/World-AI-Show-Bengaluru-2027)
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const repoPath = "/World-AI-Show-Bengaluru-2027";

            function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  walk(full);
                } else if (/\.(ts|tsx|js|jsx|json|css|html|svg)$/.test(entry.name)) {
                  let content = fs.readFileSync(full, "utf8");
                  let modified = false;

                  if (content.includes("/bengaluru/cybersecurity")) {
                    content = content.split("/bengaluru/cybersecurity").join(repoPath);
                    modified = true;
                  }
                  if (content.includes("/mumbai/enterprise")) {
                    content = content.split("/mumbai/enterprise").join(repoPath);
                    modified = true;
                  }
                  if (content.includes("/worldaishow-india")) {
                    content = content.split("/worldaishow-india").join(repoPath);
                    modified = true;
                  }

                  if (modified) {
                    fs.writeFileSync(full, content, "utf8");
                  }
                }
              }
            }

            walk("src");
            walk("public");

            let cfg = fs.readFileSync("next.config.ts", "utf8");
            cfg = cfg
              .replace(/basePath:\s*["\x27][^"\x27]+["\x27]/, `basePath: "${repoPath}"`)
              .split("/bengaluru/cybersecurity").join(repoPath)
              .split("/mumbai/enterprise").join(repoPath);
            fs.writeFileSync("next.config.ts", cfg, "utf8");
          '

      - name: Build with Next.js
        run: npm run build

      - name: Add .nojekyll to out/
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
